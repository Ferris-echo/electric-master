<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="高级电工刷题">
    <title>高级电工理论考试刷题助手 · 智能全真版</title>
    <!-- Tailwind CSS (国内直连优化) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased select-none">
    <div id="app" class="min-h-screen bg-gray-100 flex flex-col md:flex-row font-sans">
        
        <!-- Mobile Header -->
        <div class="md:hidden bg-blue-700 text-white p-4 flex justify-between items-center shadow-md z-30 sticky top-0">
            <h1 class="font-bold text-lg flex items-center gap-2">
                <span id="icon-lightning-mobile"></span> 高级电工刷题
            </h1>
            <div class="flex items-center gap-2">
                <button id="btn-mobile-search" class="p-2 hover:bg-blue-600 rounded-lg text-white" title="搜题">
                    <span id="icon-search-mobile"></span>
                </button>
                <button id="btn-mobile-menu" class="p-2 hover:bg-blue-600 rounded-lg text-white" title="菜单">
                    <span id="icon-menu-mobile"></span>
                </button>
            </div>
        </div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="hidden md:flex w-full md:w-72 bg-white md:h-screen shadow-lg flex-shrink-0 flex-col z-20 transition-all duration-300">
            <!-- Sidebar Header -->
            <div class="p-5 bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-sm flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-black tracking-wide flex items-center gap-2">
                        <span id="icon-lightning"></span> 电工刷题宝典
                    </h1>
                    <p class="text-blue-100 text-xs mt-1 font-medium">国家职业资格 · 高级维修电工题库</p>
                </div>
                <button id="btn-close-sidebar-mobile" class="md:hidden p-1 text-white hover:bg-blue-600 rounded">
                    <span id="icon-close-sidebar"></span>
                </button>
            </div>

            <!-- Sidebar Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                
                <!-- Quick Backup / Search Grid -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-quick-search" class="flex items-center justify-center p-2.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 text-xs font-bold gap-1.5 transition">
                        <span id="icon-search-btn"></span> 题库搜题
                    </button>
                    <button id="btn-export-backup" class="flex items-center justify-center p-2.5 bg-indigo-50 text-indigo-700 rounded-xl hover:bg-indigo-100 text-xs font-bold gap-1.5 transition">
                        <span id="icon-export"></span> 备份进度
                    </button>
                    <input type="file" id="file-import-input" accept=".json" class="hidden" />
                </div>

                <!-- SECTION 1: 1000题全量刷题版本 -->
                <div>
                    <div class="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 px-2 flex items-center justify-between">
                        <span>📚 全部题库刷题 (1000题)</span>
                        <span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold">全量直刷</span>
                    </div>
                    <div class="space-y-1">
                        <button class="nav-item-btn w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all" data-mode="full" data-filter="all">
                            <span class="nav-icon"><span id="icon-folder-all"></span></span>
                            <div class="flex-1">
                                <div class="font-bold">全部题目全刷</div>
                                <div class="text-[11px] text-gray-400">完整 1000 题连续练习</div>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-bold">1000题</span>
                        </button>
                        <button class="nav-item-btn w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all" data-mode="full" data-filter="choice">
                            <span class="nav-icon"><span id="icon-folder-choice"></span></span>
                            <div class="flex-1">
                                <div class="font-bold">单选题专练</div>
                                <div class="text-[11px] text-gray-400">单选题集中攻坚</div>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-bold">800题</span>
                        </button>
                        <button class="nav-item-btn w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all" data-mode="full" data-filter="judge">
                            <span class="nav-icon"><span id="icon-folder-judge"></span></span>
                            <div class="flex-1">
                                <div class="font-bold">判断题专练</div>
                                <div class="text-[11px] text-gray-400">判断题速记练习</div>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-bold">200题</span>
                        </button>
                    </div>
                </div>

                <!-- SECTION 2: 历年分卷版本 -->
                <div>
                    <div class="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 px-2 flex items-center justify-between">
                        <span>📑 历年真题分卷 (5套卷)</span>
                        <span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">原卷专区</span>
                    </div>
                    <div id="paper-list-container" class="space-y-1">
                        <!-- Populated dynamically: 2024模拟卷, 卷一, 卷二, 卷三, 卷四 -->
                    </div>
                </div>

                <!-- SECTION 3: 随机模考版本 -->
                <div>
                    <div class="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 px-2 flex items-center justify-between">
                        <span>🎲 模拟考场 (随机抽卷)</span>
                        <span class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold">考前冲刺</span>
                    </div>
                    <div class="space-y-1">
                        <button class="nav-item-btn w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all bg-gradient-to-r from-red-50 to-orange-50 hover:from-red-100 hover:to-orange-100 text-red-800 border border-red-100 font-bold" data-mode="exam-random">
                            <span class="nav-icon text-red-600"><span id="icon-award"></span></span>
                            <div class="flex-1">
                                <div class="font-bold text-red-700">全真模拟考试</div>
                                <div class="text-[11px] text-red-500 font-normal">抽160单选+40判断 · 限时120分</div>
                            </div>
                            <span class="text-xs bg-red-200 text-red-800 px-2 py-0.5 rounded-full font-bold">100分</span>
                        </button>
                        <button class="nav-item-btn w-full text-left px-3 py-2 rounded-xl flex items-center gap-2.5 text-sm transition-all text-gray-700 hover:bg-gray-100" data-mode="quick-quiz">
                            <span class="nav-icon text-orange-500"><span id="icon-sparkles"></span></span>
                            <div class="flex-1">
                                <div class="font-medium">碎片快速自测</div>
                                <div class="text-[11px] text-gray-400">随机抽50题 · 限时30分</div>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-bold">50题</span>
                        </button>
                    </div>
                </div>

                <!-- SECTION 4: 错题本与收藏夹 -->
                <div class="pt-2 border-t border-gray-100 space-y-1.5">
                    <button id="btn-nav-wrong" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all text-gray-700 hover:bg-orange-50 hover:text-orange-700">
                        <span class="nav-icon text-orange-500"><span id="icon-alert-circle"></span></span>
                        <div class="flex-1">
                            <div class="font-bold">错题回顾本</div>
                            <div id="sidebar-wrong-count" class="text-[11px] text-gray-400">0 道待复习</div>
                        </div>
                    </button>
                    <button id="btn-nav-fav" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 text-sm transition-all text-gray-700 hover:bg-yellow-50 hover:text-yellow-700">
                        <span class="nav-icon text-yellow-500"><span id="icon-star"></span></span>
                        <div class="flex-1">
                            <div class="font-bold">重点收藏夹</div>
                            <div id="sidebar-fav-count" class="text-[11px] text-gray-400">0 道重点题</div>
                        </div>
                    </button>
                </div>

                <!-- Footer Utilities -->
                <div class="pt-3 border-t border-gray-200 space-y-1.5 text-xs">
                    <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-gray-50 border border-gray-100">
                        <span class="font-bold text-gray-700 flex items-center gap-1.5">
                            <span id="icon-eye"></span> 背题模式 (直显答案)
                        </span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-recite-mode" class="sr-only peer">
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <button id="btn-reset-current" class="w-full text-left p-2.5 rounded-lg flex items-center gap-2 hover:bg-gray-100 text-gray-600 transition">
                        <span id="icon-refresh"></span> 清除当前版本做题进度
                    </button>
                    <button id="btn-clear-all-data" class="w-full text-left p-2.5 rounded-lg flex items-center gap-2 hover:bg-red-50 text-red-500 transition">
                        <span id="icon-trash"></span> 清空所有做题历史与错题
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            <!-- Top Status Bar -->
            <div class="bg-white shadow-sm px-4 md:px-8 py-3.5 flex justify-between items-center z-10 border-b border-gray-100 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <span id="badge-current-module" class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-blue-100 text-blue-700 shadow-sm">
                        全部题库 (1000题)
                    </span>
                    <span class="text-gray-300 text-xs hidden sm:inline">|</span>
                    
                    <!-- Question navigation button -->
                    <button id="btn-open-grid-modal" class="flex items-center gap-1.5 hover:bg-gray-100 px-3 py-1 rounded-lg transition-colors text-gray-600 text-sm font-semibold">
                        第 <span id="text-current-qnum" class="text-blue-700 text-base font-black">1</span> / <span id="text-total-qnum" class="text-gray-900 font-bold">1000</span> 题
                        <span id="icon-grid-btn"></span>
                    </button>

                    <!-- Auto-advance indicator -->
                    <span id="badge-recite-status" class="hidden sm:inline-block text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">
                        背题模式
                    </span>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Exam Timer Badge -->
                    <div id="exam-timer-box" class="hidden items-center gap-1.5 bg-red-50 border border-red-200 text-red-600 font-mono font-bold text-sm px-3 py-1 rounded-full animate-pulse shadow-sm">
                        <span id="icon-timer"></span>
                        <span id="exam-timer-clock">120:00</span>
                    </div>

                    <!-- Submit Exam Button -->
                    <button id="btn-header-submit-exam" class="hidden px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-xs shadow-md transition transform active:scale-95">
                        交卷评分
                    </button>

                    <!-- Top progress bar -->
                    <div class="w-24 sm:w-36 md:w-48 bg-gray-200 rounded-full h-2 overflow-hidden shadow-inner hidden sm:block">
                        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Question Scroll Area -->
            <div id="question-scroll-area" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                <!-- Dynamically populated question card -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->

    <!-- Grid Navigation Drawer Modal (Slide Over) -->
    <div id="grid-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-end z-50 hidden animate-fade-in">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform transition-transform animate-fade-in-up">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
                    <span id="icon-grid-title"></span> 题号导航面板
                </h2>
                <button id="btn-close-grid-modal" class="text-gray-400 hover:text-gray-700 p-1">
                    <span id="icon-close-grid"></span>
                </button>
            </div>
            
            <!-- Statistics row inside drawer -->
            <div class="p-3 bg-blue-50 border-b border-blue-100 flex justify-around text-xs font-bold">
                <span class="text-green-700">正确: <span id="drawer-stat-correct">0</span></span>
                <span class="text-red-700">错误: <span id="drawer-stat-wrong">0</span></span>
                <span class="text-gray-600">未做: <span id="drawer-stat-unanswered">0</span></span>
                <span class="text-blue-700">总计: <span id="drawer-stat-total">0</span></span>
            </div>

            <div id="grid-buttons-container" class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                <!-- Grid buttons dynamically inserted here -->
            </div>

            <div class="p-4 border-t bg-gray-50 text-xs text-gray-500 flex justify-between px-6">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-green-500"></span> 正确</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500"></span> 错误</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-500"></span> 已选</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-gray-200"></span> 未做</span>
            </div>
        </div>
    </div>

    <!-- Circuit Image Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-[80] p-4 hidden animate-fade-in">
        <button id="btn-close-lightbox" class="absolute top-4 right-4 text-white hover:text-gray-300 p-2 text-2xl font-bold bg-white/10 rounded-full w-12 h-12 flex items-center justify-center">
            ✕
        </button>
        <div class="max-w-4xl max-h-[85vh] p-2 bg-white rounded-xl overflow-hidden shadow-2xl">
            <img id="lightbox-img" class="w-full h-auto max-h-[80vh] object-contain" src="" alt="电气原理图放大">
        </div>
    </div>

    <!-- Exam Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[70] p-4 hidden animate-fade-in">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 text-center transform transition-all animate-fade-in-up">
            <div id="result-badge-icon" class="text-5xl mb-2">🎉</div>
            <h2 class="text-2xl font-black text-gray-800 mb-1">考试成绩单</h2>
            <p id="result-exam-title" class="text-xs text-gray-500 mb-4">全真模拟考试 (120分钟)</p>

            <div class="py-4 my-2 bg-blue-50 rounded-2xl border border-blue-100 flex flex-col items-center justify-center">
                <div class="text-xs font-bold text-blue-600 mb-1">最终得分</div>
                <div id="result-score-val" class="text-5xl font-black text-blue-700 leading-none">88.5</div>
                <div id="result-pass-pill" class="mt-3 px-4 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 border border-green-200">
                    考试及格 · 恭喜通过！
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 my-4 text-xs">
                <div class="p-2.5 bg-gray-50 rounded-xl">
                    <div class="text-gray-400">满分</div>
                    <div id="result-full-score" class="text-base font-bold text-gray-800">100 分</div>
                </div>
                <div class="p-2.5 bg-green-50 rounded-xl">
                    <div class="text-green-600">答对</div>
                    <div id="result-correct-count" class="text-base font-bold text-green-700">177 题</div>
                </div>
                <div class="p-2.5 bg-red-50 rounded-xl">
                    <div class="text-red-600">答错</div>
                    <div id="result-wrong-count" class="text-base font-bold text-red-700">23 题</div>
                </div>
            </div>

            <p id="result-time-text" class="text-xs text-gray-400 mb-6">耗时：45分20秒</p>

            <div class="grid grid-cols-2 gap-3">
                <button id="btn-result-review" class="py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md text-sm transition">
                    回顾错题
                </button>
                <button id="btn-result-close" class="py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition">
                    返回考场
                </button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-start justify-center z-[60] p-4 pt-16 hidden animate-fade-in">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden animate-fade-in-up">
            <div class="p-4 border-b flex items-center gap-3 bg-gray-50">
                <span class="text-gray-400 text-lg">🔍</span>
                <input type="text" id="search-input" class="flex-1 bg-transparent border-none outline-none text-base text-gray-800 placeholder-gray-400" placeholder="搜索题目关键词（如：PLC、晶闸管、变压器、RAM、二极管）..." />
                <button id="btn-close-search" class="text-gray-400 hover:text-gray-700 p-1">
                    ✕
                </button>
            </div>
            <div id="search-results-list" class="flex-1 overflow-y-auto p-4 space-y-2.5 custom-scrollbar">
                <div class="text-center text-gray-400 py-10 text-sm">
                    输入关键词搜索全部 1000 道题库
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Drawer Overlay -->
    <div id="mobile-sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden"></div>

    <!-- Database Script -->
    <script src="questions_db.js"></script>
    <!-- App Engine Script -->
    <script src="app.js"></script>
</body>
</html>
