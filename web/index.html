<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="高级电工刷题">
  <meta name="theme-color" content="#2563eb">
  <title>高级电工考试理论刷题宝典</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
</head>
<body data-theme="dark">

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span>高级电工刷题</span>
      </div>

      <div class="header-controls">
        <!-- Mode Selector -->
        <select id="modeSelect" class="select-input" title="选择做题模式">
          <option value="practice">🎯 练习模式 (即答即显)</option>
          <option value="recite">📖 背题模式 (直显答案)</option>
          <option value="exam-random">🎲 全真随机模考 (200题)</option>
          <option value="exam-paper">📝 套卷模拟考 (整套卷)</option>
          <option value="quick">⚡ 快速测验 (50题)</option>
          <option value="wrong">❌ 智能错题本</option>
          <option value="favorite">⭐ 重点收藏夹</option>
        </select>

        <!-- Paper Selector -->
        <select id="paperSelect" class="select-input" title="选择试卷">
          <!-- Dynamically populated -->
        </select>

        <!-- Timer for Exam -->
        <div id="examTimer" class="timer-badge">
          <span>⏱️</span>
          <span id="timerText">120:00</span>
        </div>

        <!-- Submit Exam Button -->
        <button id="btnSubmitExam" class="btn btn-danger" style="display:none;">
          交卷
        </button>

        <!-- Search Button -->
        <button id="btnSearch" class="btn btn-icon" title="搜索题目">
          🔍
        </button>

        <!-- Theme Toggle -->
        <button id="btnThemeToggle" class="btn btn-icon" title="切换明亮/暗黑模式">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-wrapper">
    <!-- Left / Question Card Area -->
    <section class="question-card" id="questionCard">
      <div class="question-meta">
        <div class="meta-tags">
          <span id="badgeType" class="badge badge-type">单选题</span>
          <span id="badgeScore" class="badge badge-score">0.5分</span>
          <span id="badgeFav" class="badge badge-fav" style="display:none;">已收藏</span>
        </div>
        <div class="q-index-display">
          第 <span id="currentQNum">1</span> / <span id="totalQNum">200</span> 题
        </div>
      </div>

      <!-- Question Stem -->
      <div id="questionContent" class="question-content">
        题目加载中...
      </div>

      <!-- Circuit / Formula Images -->
      <div id="questionImages" class="question-images">
        <!-- Dynamically populated -->
      </div>

      <!-- Options List -->
      <div id="optionsList" class="options-list">
        <!-- Dynamically populated -->
      </div>

      <!-- Explanation Box -->
      <div id="explanationBox" class="explanation-box">
        <div class="exp-title">
          <span>标准答案：</span>
          <span id="correctAnswerText" class="exp-ans">A</span>
        </div>
        <div id="explanationDetail" style="font-size:0.95rem; color:var(--text-sub);">
          解析提示：国家职业资格《维修电工》高级理论考核要点。
        </div>
      </div>

      <!-- Bottom Nav Bar -->
      <div class="bottom-actions">
        <button id="btnPrev" class="btn">
          ← 上一题
        </button>

        <button id="btnToggleFav" class="btn">
          ⭐ 收藏本题
        </button>

        <button id="btnToggleDrawer" class="btn mobile-drawer-toggle">
          📋 答题卡 (<span id="answeredCountBadge">0</span>)
        </button>

        <button id="btnNext" class="btn btn-primary">
          下一题 →
        </button>
      </div>
    </section>

    <!-- Right / Side Matrix Card Grid -->
    <aside class="side-panel" id="sidePanel">
      <div class="panel-header">
        <span>📋 答题卡矩阵</span>
        <div class="stat-pills">
          <span class="stat-pill answered">已答 <b id="statAnswered">0</b></span>
          <span class="stat-pill correct">正确 <b id="statCorrect">0</b></span>
          <span class="stat-pill wrong">错误 <b id="statWrong">0</b></span>
        </div>
      </div>

      <div class="grid-container">
        <div id="cardGrid" class="card-grid">
          <!-- Dynamically populated (1..200 buttons) -->
        </div>
      </div>

      <!-- Drawer Close on Mobile -->
      <button id="btnCloseDrawer" class="btn mobile-drawer-toggle" style="width:100%;">
        收起答题卡
      </button>
    </aside>
  </main>

  <!-- Mobile Drawer Overlay -->
  <div id="drawerOverlay" class="drawer-overlay"></div>

  <!-- Image Lightbox Modal -->
  <div id="lightboxModal" class="lightbox-modal">
    <button id="btnCloseLightbox" class="lightbox-close">✕</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="电路放大图">
  </div>

  <!-- Exam Result Modal -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="font-size:1.5rem;">🎉 考试成绩单</h2>
      <div class="score-badge-huge" id="scoreDisplay">85.5</div>
      <div id="passBadge" class="pass-status-pill passed">合格 (通过)</div>

      <div class="result-breakdown">
        <div>
          <div class="breakdown-val" id="resTotalScore">100</div>
          <div class="breakdown-label">试卷满分</div>
        </div>
        <div>
          <div class="breakdown-val" id="resCorrectCount" style="color:var(--success);">171</div>
          <div class="breakdown-label">答对题数</div>
        </div>
        <div>
          <div class="breakdown-val" id="resWrongCount" style="color:var(--error);">29</div>
          <div class="breakdown-label">答错题数</div>
        </div>
      </div>

      <div style="font-size:0.9rem; color:var(--text-sub);" id="resTimeUsed">
        考试用时：42 分 18 秒
      </div>

      <div style="display:flex; gap:0.75rem; width:100%;">
        <button id="btnReviewWrongs" class="btn btn-primary" style="flex:1;">
          查看错题分析
        </button>
        <button id="btnCloseResult" class="btn" style="flex:1;">
          返回刷题
        </button>
      </div>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="searchModal" class="search-modal">
    <div class="search-box-card">
      <div class="search-header">
        <input type="text" id="searchInput" class="search-input" placeholder="输入关键词（如：晶闸管、PLC、变压器、RAM）...">
        <button id="btnCloseSearch" class="btn btn-icon">✕</button>
      </div>
      <div id="searchResults" class="search-results">
        <div style="text-align:center; color:var(--text-muted); padding:2rem;">
          输入关键词搜索全题库 1000 道题目
        </div>
      </div>
    </div>
  </div>

  <!-- Data Script -->
  <script src="../data/questions_db.js"></script>
  <!-- App Engine Script -->
  <script src="app.js"></script>
</body>
</html>
