<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="高级电工刷题">
  <meta name="theme-color" content="#2563eb">
  <title>高级电工考试理论刷题宝典</title>
  <link rel="manifest" href="manifest.json">
  <style>
:root {
  --bg-primary: #0f172a;
  --bg-surface: #1e293b;
  --bg-card: #334155;
  --bg-hover: #475569;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --text-muted: #64748b;
  --border: #334155;
  --border-focus: #3b82f6;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-light: rgba(59, 130, 246, 0.15);
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.15);
  --error: #ef4444;
  --error-bg: rgba(239, 68, 68, 0.15);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --gold: #fbbf24;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

[data-theme="light"] {
  --bg-primary: #f1f5f9;
  --bg-surface: #ffffff;
  --bg-card: #f8fafc;
  --bg-hover: #e2e8f0;
  --text-main: #0f172a;
  --text-sub: #475569;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --border-focus: #2563eb;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: rgba(37, 99, 235, 0.1);
  --success: #059669;
  --success-bg: #ecfdf5;
  --error: #dc2626;
  --error-bg: #fef2f2;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.25s, color 0.25s;
  overflow-x: hidden;
}

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}

.header-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text-main);
  flex-shrink: 0;
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.1rem;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

select.select-input {
  background-color: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.45rem 0.75rem;
  font-size: 0.875rem;
  outline: none;
  cursor: pointer;
  max-width: 200px;
}
select.select-input:focus {
  border-color: var(--border-focus);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.45rem 0.85rem;
  font-size: 0.875rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  background-color: var(--bg-card);
  color: var(--text-main);
}
.btn:hover {
  background-color: var(--bg-hover);
}
.btn:active {
  transform: scale(0.98);
}
.btn-primary {
  background-color: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background-color: var(--primary-hover);
}
.btn-danger {
  background-color: var(--error);
  color: #fff;
}
.btn-icon {
  padding: 0.45rem;
  border-radius: 50%;
  width: 36px;
  height: 36px;
}

/* Exam Timer Badge */
.timer-badge {
  display: none;
  align-items: center;
  gap: 0.35rem;
  font-weight: 700;
  font-size: 0.95rem;
  background-color: var(--primary-light);
  color: var(--primary);
  padding: 0.35rem 0.75rem;
  border-radius: 20px;
  border: 1px solid var(--primary);
}
.timer-badge.warning {
  background-color: var(--warning-bg);
  color: var(--warning);
  border-color: var(--warning);
  animation: pulse 1.5s infinite;
}
.timer-badge.danger {
  background-color: var(--error-bg);
  color: var(--error);
  border-color: var(--error);
  animation: pulse 0.8s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Main Layout */
.main-wrapper {
  flex: 1;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: 1rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
}

@media (min-width: 992px) {
  .main-wrapper {
    grid-template-columns: minmax(0, 1fr) 340px;
  }
}

/* Question Area */
.question-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.question-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
}

.meta-tags {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.badge {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  text-transform: uppercase;
}
.badge-type {
  background-color: var(--primary-light);
  color: var(--primary);
}
.badge-score {
  background-color: var(--bg-card);
  color: var(--text-sub);
}
.badge-fav {
  background-color: rgba(251, 191, 36, 0.15);
  color: var(--gold);
}

.q-index-display {
  font-weight: 700;
  font-size: 1rem;
  color: var(--text-sub);
}

.question-content {
  font-size: 1.125rem;
  line-height: 1.7;
  color: var(--text-main);
  white-space: pre-wrap;
}

/* Question Images */
.question-images {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin: 0.5rem 0;
}
.q-img-wrap {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.5rem;
  cursor: zoom-in;
  transition: transform 0.2s, box-shadow 0.2s;
  max-width: 100%;
}
.q-img-wrap:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.q-img-wrap img {
  max-height: 220px;
  max-width: 100%;
  object-fit: contain;
  display: block;
}

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.option-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 1.05rem;
  line-height: 1.5;
  user-select: none;
}
.option-item:hover {
  border-color: var(--primary);
  background-color: var(--bg-hover);
}
.option-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.875rem;
  flex-shrink: 0;
  transition: all 0.2s;
}
.option-text {
  flex: 1;
  word-break: break-word;
}
.option-status-icon {
  margin-left: auto;
  font-size: 1.1rem;
  display: none;
}

/* Selected state (in exam mode) */
.option-item.selected {
  border-color: var(--primary);
  background-color: var(--primary-light);
}
.option-item.selected .option-letter {
  background-color: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Correct state */
.option-item.correct {
  border-color: var(--success) !important;
  background-color: var(--success-bg) !important;
}
.option-item.correct .option-letter {
  background-color: var(--success) !important;
  color: #fff !important;
  border-color: var(--success) !important;
}
.option-item.correct .option-status-icon {
  display: block;
  color: var(--success);
}

/* Wrong state */
.option-item.wrong {
  border-color: var(--error) !important;
  background-color: var(--error-bg) !important;
}
.option-item.wrong .option-letter {
  background-color: var(--error) !important;
  color: #fff !important;
  border-color: var(--error) !important;
}
.option-item.wrong .option-status-icon {
  display: block;
  color: var(--error);
}

/* Answer & Explanation Box */
.explanation-box {
  background-color: var(--bg-card);
  border-left: 4px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 1rem;
  display: none;
  flex-direction: column;
  gap: 0.5rem;
}
.explanation-box.show {
  display: flex;
}
.exp-title {
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.exp-ans {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--success);
}

/* Navigation & Bottom Bar */
.bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}

/* Side Card Grid (Desktop / Tablet) */
.side-panel {
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  height: calc(100vh - 100px);
  position: sticky;
  top: 76px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
}

.stat-pills {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.stat-pill {
  font-size: 0.75rem;
  padding: 0.2rem 0.5rem;
  border-radius: 12px;
  background-color: var(--bg-card);
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.stat-pill.correct { color: var(--success); }
.stat-pill.wrong { color: var(--error); }
.stat-pill.answered { color: var(--primary); }

.grid-container {
  flex: 1;
  overflow-y: auto;
  padding-right: 0.25rem;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.4rem;
}
@media (min-width: 1200px) {
  .card-grid {
    grid-template-columns: repeat(8, 1fr);
  }
}

.card-btn {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid var(--border);
  background-color: var(--bg-card);
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.15s;
}
.card-btn:hover {
  border-color: var(--primary);
  background-color: var(--bg-hover);
}
.card-btn.current {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--border-focus);
  font-weight: 800;
}
.card-btn.correct {
  background-color: var(--success-bg);
  border-color: var(--success);
  color: var(--success);
}
.card-btn.wrong {
  background-color: var(--error-bg);
  border-color: var(--error);
  color: var(--error);
}
.card-btn.answered {
  background-color: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}

/* Mobile Drawer */
.mobile-drawer-toggle {
  display: none;
}
@media (max-width: 991px) {
  .side-panel {
    display: none;
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    z-index: 50;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  .side-panel.open {
    display: flex;
  }
  .mobile-drawer-toggle {
    display: inline-flex;
  }
  .drawer-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 45;
  }
  .drawer-overlay.open {
    display: block;
  }
}

/* Modal Lightbox & Result Dialog */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open {
  display: flex;
}

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 2rem;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.25rem;
}

.score-badge-huge {
  font-size: 3.5rem;
  font-weight: 900;
  color: var(--primary);
  line-height: 1;
}
.pass-status-pill {
  font-size: 1.1rem;
  font-weight: 700;
  padding: 0.35rem 1.25rem;
  border-radius: 20px;
}
.pass-status-pill.passed {
  background-color: var(--success-bg);
  color: var(--success);
  border: 1px solid var(--success);
}
.pass-status-pill.failed {
  background-color: var(--error-bg);
  color: var(--error);
  border: 1px solid var(--error);
}

.result-breakdown {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  background: var(--bg-card);
  padding: 1rem;
  border-radius: var(--radius-md);
}
.breakdown-val {
  font-size: 1.25rem;
  font-weight: 700;
}
.breakdown-label {
  font-size: 0.75rem;
  color: var(--text-sub);
}

/* Fullscreen Image Lightbox */
.lightbox-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.lightbox-modal.open {
  display: flex;
}
.lightbox-img {
  max-width: 95vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  background: #ffffff;
  padding: 0.5rem;
}
.lightbox-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Search Overlay */
.search-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 90;
  padding: 2rem 1rem;
}
.search-modal.open {
  display: flex;
  justify-content: center;
}
.search-box-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 680px;
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.search-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.search-input {
  flex: 1;
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.85rem;
  font-size: 1rem;
  outline: none;
}
.search-results {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.search-item {
  background: var(--bg-card);
  padding: 0.75rem 1rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.search-item:hover {
  background: var(--bg-hover);
}
.search-item mark {
  background: rgba(251, 191, 36, 0.4);
  color: inherit;
  padding: 0 2px;
}

</style>
</head>
<body data-theme="dark">

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span>高级电工刷题</span>
      </div>

      <div class="header-controls">
        <!-- Mode Selector -->
        <select id="modeSelect" class="select-input" title="选择做题模式">
          <option value="practice">🎯 练习模式 (即答即显)</option>
          <option value="recite">📖 背题模式 (直显答案)</option>
          <option value="exam-random">🎲 全真随机模考 (200题)</option>
          <option value="exam-paper">📝 套卷模拟考 (整套卷)</option>
          <option value="quick">⚡ 快速测验 (50题)</option>
          <option value="wrong">❌ 智能错题本</option>
          <option value="favorite">⭐ 重点收藏夹</option>
        </select>

        <!-- Paper Selector -->
        <select id="paperSelect" class="select-input" title="选择试卷">
          <!-- Dynamically populated -->
        </select>

        <!-- Timer for Exam -->
        <div id="examTimer" class="timer-badge">
          <span>⏱️</span>
          <span id="timerText">120:00</span>
        </div>

        <!-- Submit Exam Button -->
        <button id="btnSubmitExam" class="btn btn-danger" style="display:none;">
          交卷
        </button>

        <!-- Search Button -->
        <button id="btnSearch" class="btn btn-icon" title="搜索题目">
          🔍
        </button>

        <!-- Theme Toggle -->
        <button id="btnThemeToggle" class="btn btn-icon" title="切换明亮/暗黑模式">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-wrapper">
    <!-- Left / Question Card Area -->
    <section class="question-card" id="questionCard">
      <div class="question-meta">
        <div class="meta-tags">
          <span id="badgeType" class="badge badge-type">单选题</span>
          <span id="badgeScore" class="badge badge-score">0.5分</span>
          <span id="badgeFav" class="badge badge-fav" style="display:none;">已收藏</span>
        </div>
        <div class="q-index-display">
          第 <span id="currentQNum">1</span> / <span id="totalQNum">200</span> 题
        </div>
      </div>

      <!-- Question Stem -->
      <div id="questionContent" class="question-content">
        题目加载中...
      </div>

      <!-- Circuit / Formula Images -->
      <div id="questionImages" class="question-images">
        <!-- Dynamically populated -->
      </div>

      <!-- Options List -->
      <div id="optionsList" class="options-list">
        <!-- Dynamically populated -->
      </div>

      <!-- Explanation Box -->
      <div id="explanationBox" class="explanation-box">
        <div class="exp-title">
          <span>标准答案：</span>
          <span id="correctAnswerText" class="exp-ans">A</span>
        </div>
        <div id="explanationDetail" style="font-size:0.95rem; color:var(--text-sub);">
          解析提示：国家职业资格《维修电工》高级理论考核要点。
        </div>
      </div>

评分人"], "answer": "D", "images": []}, {"index": 161, "type": "judge", "score": 0.5, "content": "驱动电路装置的步进电动机驱动器采用单电源步进电机驱动电路。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 162, "type": "judge", "score": 0.5, "content": "高压整流电路供给震荡管的电压。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 163, "type": "judge", "score": 0.5, "content": "GP－100C3高频振荡电路中采用阳极控制的方法来实现振荡器的起振和停振。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 164, "type": "judge", "score": 0.5, "content": "在数控机床的伺服驱动机构中，常用的伺服驱动元件有步进电动机、液压马达和大惯量直流电动机、交流伺服电动机等。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 165, "type": "judge", "score": 0.5, "content": "在经济型数控系统中较广泛使用的是采用伺服电动机作力驱动执行元件的开环控制系统。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 166, "type": "judge", "score": 0.5, "content": "半闭环控制系统由于检测元件检测的不包含从旋转轴到工作台之间传动链的误差，因此，这种控制系统称为半闭环控制系统。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 167, "type": "judge", "score": 0.5, "content": "共阳极整流电路的工作原理和分析方法与共阴极电路相同，只是电压方向相同、电流方向相反。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 168, "type": "judge", "score": 0.5, "content": "在Rˊ=Ri的状态下，无论从功率或效率的角度来看，都比较理想，故这种状态称为振荡器的最佳状态。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 169, "type": "judge", "score": 0.5, "content": "励磁绕组与电枢绕组连接极性相反而不能发电。将其连接正确即可。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 170, "type": "judge", "score": 0.5, "content": "对于振荡管，在起振时基极对地为正电压，也可用示波器观察其振荡波形。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 171, "type": "judge", "score": 0.5, "content": "全导通时直流输出电压Ud＝1.1E（E为相电压有效值）。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 172, "type": "judge", "score": 0.5, "content": "SP100-C3型高频设备接通电源加热后无栅流不振荡。不振荡的原因很多。如果振荡管的阳极直流电源和灯丝电源都是正常的，则应该在半高压的情况下观察一下阳极电流。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 173, "type": "judge", "score": 0.5, "content": "弱磁调速是从n0向下调速，调速特性为恒功率输出。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 174, "type": "judge", "score": 0.5, "content": "开环控制系统仅适用于要求高的场合。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 175, "type": "judge", "score": 0.5, "content": "延时电路可分别在HTL或非门的输入端加接二极管和不同容量的电容器。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 176, "type": "judge", "score": 0.5, "content": "主回路采用三相桥式交叉连接有环流的电枢供电。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 177, "type": "judge", "score": 0.5, "content": "经济型数控系统常用的有后备电池法和采用非易失性存储器。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 178, "type": "judge", "score": 0.5, "content": "传统的驱动电源有单电源驱动电路和双电源驱动电路，新型电源有高压电压斩波电源。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 179, "type": "judge", "score": 0.5, "content": "高、低压双电源驱动电路适用于电流较小的伺服式步进电动机。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 180, "type": "judge", "score": 0.5, "content": "三相六拍脉冲分配逻辑电路由FFl、FF2、FF3三位JK触发器组成。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 181, "type": "judge", "score": 0.5, "content": "当电网电压过低或瞬间断电时，掉电保护是避免CPU失控，RAM数据混乱丢失的重要措施。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 182, "type": "judge", "score": 0.5, "content": "为使振荡管真空度保持正常，可以将备用管子定期在设备上轮换使用。经验证明，每隔三、四个月轮换使用一次管子，对于延长其工作寿命是有益的。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 183, "type": "judge", "score": 0.5, "content": "从取下旧电池到装上新电池的时间要尽量短，一般不允许超过3 min。如果时间过长，将会丢失程序。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 184, "type": "judge", "score": 0.5, "content": "由于各种原因所引起的故障报警时，报警指示灯亮。可进一步通过编程器查看报警信息。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 185, "type": "judge", "score": 0.5, "content": "通电前的检查，首先确认输入电源电压和频率。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 186, "type": "judge", "score": 0.5, "content": "检查变压器上有无多个插头，检查电路板上有无50/60Hz频率转换开关供选择。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 187, "type": "judge", "score": 0.5, "content": "对于单台购入的数控装置，用户则应根据需要自行设定。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 188, "type": "judge", "score": 0.5, "content": "检查直流电源输出端为系统提供的+5V、+6V、+40V、+120V等电源电压有无通地和短路现象。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 189, "type": "judge", "score": 0.5, "content": "对机床上的各交流电动机如冷却风扇、液压泵电动机、冷却泵电动机等逐一分别接通电源，观察电动机转向是否正确、有无异常声响。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 190, "type": "judge", "score": 0.5, "content": "如有自诊断功能，故障会自动显示报警信息，此时可先按“MON”复位键。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 191, "type": "judge", "score": 0.5, "content": "数控系统的辅助功能就是M功能。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 192, "type": "judge", "score": 0.5, "content": "数控系统参数有一部分可以由用户根据情况进行适当的修改。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 193, "type": "judge", "score": 0.5, "content": "选用“手动1”方式单步点动，用手触摸电动机轴，观察步进电动机走步是否正常。如不正常可首先检查与电动机连接的机械部分是否有问题。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 194, "type": "judge", "score": 0.5, "content": "接通主轴驱动系统电源，检查主轴正、反转及停止，检查调速是否正常。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 195, "type": "judge", "score": 0.5, "content": "装置通电后，先观察显示屏上显示数据及有无报警信息，并检查数控装置内有关指示灯等信号是否正常，有无异常气味等。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 196, "type": "judge", "score": 0.5, "content": "对于加工中心，还必须调整机械手与主轴、刀库的相对位置，以及托板与交换工作台面的相对位置，以保证换刀和交换工作台时的准确、平稳、可靠。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 197, "type": "judge", "score": 0.5, "content": "运行试验用与规定的承载工件最大重量相当的重物置于工作台上，使负载均匀。然后以最低、最高进给速度进行运转。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 198, "type": "judge", "score": 0.5, "content": "数控机床的几何精度检验包括主轴孔的径向圆跳动。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 199, "type": "judge", "score": 0.5, "content": "直线运动各轴的反向误差属于数控机床的定位精度检验。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 200, "type": "judge", "score": 0.5, "content": "数控机床的定位精度检验包括回转运动的反向误差。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}]}, {"id": "paper_2", "name": "维修电工高级理论知识试卷(二)", "total": 200, "questions": [{"index": 1, "type": "choice", "score": 0.5, "content": "职业道德是指从事一定职业劳动的人们，在长期的职业活动中形成的( )。", "options": ["A、行为规范", "B、操作程序", "C、劳动技能", "D、思维习惯"], "answer": "A", "images": []}, {"index": 2, "type": "choice", "score": 0.5, "content": "在市场经济条件下，( )是职业道德社会功能的重要表现。", "options": ["A、克服利益导向", "B、遏制牟利最大化", "C、增强决策科学化", "D、促进员工行为的规范化"], "answer": "D", "images": []}, {"index": 3, "type": "choice", "score": 0.5, "content": "企业文化的功能不包括( )。", "options": ["A、激励功能", "B、导向功能", "C、整合功能", "D、娱乐功能"], "answer": "D", "images": []}, {"index": 4, "type": "choice", "score": 0.5, "content": "职业道德对企业起到( )的作用。", "options": ["A、决定经济效益", "B、促进决策科学化", "C、增强竞争力", "D、树立员工守业意识"], "answer": "C", "images": []}, {"index": 5, "type": "choice", "score": 0.5, "content": "职业道德是人的事业成功的( )。", "options": ["A、重要保证", "B、最终结果", "C、决定条件", "D、显著标志"], "answer": "A", "images": []}, {"index": 6, "type": "choice", "score": 0.5, "content": "( )是企业诚实守信的内在要求。", "options": ["A、维护企业信誉", "B、增加职工福利", "C、注重经济效益", "D、开展员工培训"], "answer": "A", "images": []}, {"index": 7, "type": "choice", "score": 0.5, "content": "下列关于勤劳节俭的论述中，正确的选项是( )。", "options": ["A、勤劳一定能使人致富", "B、勤劳节俭有利于企业持续发展", "C、新时代需要巧干，不需要勤劳", "D、新时代需要创造，不需要节俭"], "answer": "B", "images": []}, {"index": 8, "type": "choice", "score": 0.5, "content": "企业生产经营活动中，要求员工遵纪守法是( )。", "options": ["A、约束人的体现", "B、保证经济活动正常进行所决定的", "C、领导者人为的规定", "D、追求利益的体现"], "answer": "B", "images": []}, {"index": 9, "type": "c udge", "score": 0.5, "content": "由于各种原因所引起的故障报警时，报警指示灯亮。可进一步通过监控查看报警信息。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 188, "type": "judge", "score": 0.5, "content": "当电源指示灯亮，而运行指示灯不亮（排除指示灯本身故障原因），说明系统已因某种异常而中止了正常的运行。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 189, "type": "judge", "score": 0.5, "content": "按INSTR若程序中存在某一线路上的错误，则显示出错代码。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 190, "type": "judge", "score": 0.5, "content": "通电前的检查，首先确认输入电源电压和相序。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 191, "type": "judge", "score": 0.5, "content": "检查变压器上有无多个插头，检查电路板上有无50/60Hz电源转换开关供选择。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 192, "type": "judge", "score": 0.5, "content": "数控系统的辅助功能就是T功能。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 193, "type": "judge", "score": 0.5, "content": "选用“手动1”方式单步点动，用手触摸电动机轴，观察步进电动机走步是否正常。如不正常可首先检查与电动机连接的系统部分是否有问题。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 194, "type": "judge", "score": 0.5, "content": "直线运动各轴的正向误差属于数控机床的几何精度检验。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 195, "type": "judge", "score": 0.5, "content": "机床的切削精度不仅反映了机床的几何精度和定位精度，同时还包括了试件的材料、环境温度、刀具性能以及切削条件等各种因素造成的误差。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 196, "type": "judge", "score": 0.5, "content": "JWK经济型数控机床通过编程指令可实现的功能有返回参考点。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 197, "type": "judge", "score": 0.5, "content": "使用程序暂停可使操作者做其他工作，按下启动键后，程序可继续向下进行。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 198, "type": "judge", "score": 0.5, "content": "通过两种不同方式的输出指定（可变速电动机并配置相应的强电电路）转速叫主轴变速。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 199, "type": "judge", "score": 0.5, "content": "刀具功能只能进行刀具的更换。", "options": ["正确 (√ 以上，以满磁调压调速。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 174, "type": "judge", "score": 0.5, "content": "反电枢可逆电路由于电枢回路电感大,所以适用于要求频繁启动而过渡过程时间短的生产机械，如可逆轧钢机、龙门刨等。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 175, "type": "judge", "score": 0.5, "content": "数据存储器一般用随机存储器（ROM）。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 176, "type": "judge", "score": 0.5, "content": "键盘是计算机系统最常用的人机对话输入设备，它有两种基本类型：编码键盘和非编码键盘。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 177, "type": "judge", "score": 0.5, "content": "三相六拍脉冲分配逻辑电路由FFl、FF2、FF3三位D触发器组成。其脉冲分配顺序是A→AB→B→BC→C→CA→A→……。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 178, "type": "judge", "score": 0.5, "content": "中频发电机由于原动机速度的限制不能调节频率。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 179, "type": "judge", "score": 0.5, "content": "当可编程序控制器输出额定电压和额定电流值大于负载时，可加装中间继电器过渡。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 180, "type": "judge", "score": 0.5, "content": "F系列可编程序控制器的计数器输出指令用OUT68表示。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 181, "type": "judge", "score": 0.5, "content": "F系列可编程序控制器的辅助继电器输入指令用LD100表示。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 182, "type": "judge", "score": 0.5, "content": "F系列可编程序控制器的定时器输出指令用OUT57表示。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 183, "type": "judge", "score": 0.5, "content": "连接时必须注意负载电源的类型和可编程序控制器输入输出的有关技术资料。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 184, "type": "judge", "score": 0.5, "content": "按WRITE若程序中存在某一线路上的错误，则显示出错代码。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 185, "type": "judge", "score": 0.5, "content": "线路检查键操作中代码2-1表示在一个逻辑行里LD或LDI可使用次数超过6次。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 186, "type": "judge", "score": 0.5, "content": "检查变压器上有无多个插头，检查电路板上有无50/60Hz电源转换开关供选择。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 187, "type": "judge", "score": 0.5, "content": "选用“手动1”方式单步点动，用手触摸电动机轴，观察步进电动机走步是否正常。如不正常可首先检查与电动机连接的系统部分是否有问题。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 188, "type": "judge", "score": 0.5, "content": "若试验同时满足主传动系统最大转矩试验或最大切削力试验时，两者可合并进行。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 189, "type": "judge", "score": 0.5, "content": "数控机床的几何精度包括检验各坐标方向移动的垂直度。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 190, "type": "judge", "score": 0.5, "content": "数控机床的几何精度检验包括主轴的轴向窜动。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 191, "type": "judge", "score": 0.5, "content": "主轴回转轴心线对工作台面的垂直度属于数控机床的定位精度检验。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 192, "type": "judge", "score": 0.5, "content": "机床的切削精度是一项综合精度。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 193, "type": "judge", "score": 0.5, "content": "JWK型经济型数控系统由数控单元、步进伺服驱动单元和减速步进电动机组成。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 194, "type": "judge", "score": 0.5, "content": "程序循环就是用于零件加工中局部需要反复加工动作的场合。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 195, "type": "judge", "score": 0.5, "content": "程序跳转能自动转到指定的顺序段顺序执行下去。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 196, "type": "judge", "score": 0.5, "content": "刀具功能可控制换刀和刀具补偿和换刀偏置。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 197, "type": "judge", "score": 0.5, "content": "同一个加工零件往往需要使用不同的刀具，每把刀具转至切削方位时，其刀尖所处的位置应相同，而系统要求切削前应处于同一点。刀具补偿功能使程序容易编制。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 198, "type": "judge", "score": 0.5, "content": "S功能设定有一种输出方式。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "i 方式划分。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 175, "type": "judge", "score": 0.5, "content": "数据存储器一般用随机存储器（RAM）。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 176, "type": "judge", "score": 0.5, "content": "经济型数控系统常用的有后备电池法和采用非易失性存储器。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 177, "type": "judge", "score": 0.5, "content": "将I/O接口地址与存储器空间分开设置，互不影响，由于地址总线是存储器和I/O设备共享的，需用控制信号线区别。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 178, "type": "judge", "score": 0.5, "content": "各位的段驱动及其位驱动可分别共用几个锁存器。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 179, "type": "judge", "score": 0.5, "content": "三相六拍脉冲分配逻辑电路由FFl、FF2、FF3三位JK触发器组成。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 180, "type": "judge", "score": 0.5, "content": "切断电源的顺序必须是先切断阳极电压，然后切断灯丝电压。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 181, "type": "judge", "score": 0.5, "content": "检查各外部接线端子的接线是否连接好，螺钉是否松动。保证所有接线接触良好。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 182, "type": "judge", "score": 0.5, "content": "从取下旧电池到装上新电池的时间要尽量短，一般不允许超过3 min。如果时间过长，将会丢失ROM中的内容。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 183, "type": "judge", "score": 0.5, "content": "由于各种原因所引起的故障报警时，报警指示灯亮。可进一步通过监控查看报警信息。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 184, "type": "judge", "score": 0.5, "content": "当电源指示灯亮，而运行指示灯不亮（排除指示灯本身故障原因），说明系统已因某种异常而中止了正常的运行。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 185, "type": "judge", "score": 0.5, "content": "当可编程序控制器输出额定电压和额定电流值小于负载时，可加装中间继电器过渡。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 186, "type": "judge", "score": 0.5, "content": "强供电回路的管线尽量避免与可编程序控制器输出、输入回路平行，且线路不在同一根管路内。所有金属外壳（不应带电部分）均应良好接地。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 187, "type": "judge", "score": 0.5, "content": "检查完全部线路后拆除主轴电动机、液压电动机和电磁阀电源线路并包好绝缘。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 188, "type": "judge", "score": 0.5, "content": "可编程序控制器的工作过程是周期循环扫描工作过程，其工作过程分为三个阶段。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 189, "type": "judge", "score": 0.5, "content": "数控系统的辅助功能就是T功能。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 190, "type": "judge", "score": 0.5, "content": "数控系统参数有一部分可以由用户根据情况进行适当的修改。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 191, "type": "judge", "score": 0.5, "content": "选用“手动1”方式单步点动，用手触摸电动机轴，观察步进电动机走步是否正常。如不正常可首先检查与电动机连接的机械部分是否有问题。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 192, "type": "judge", "score": 0.5, "content": "接通主轴驱动系统电源，检查主轴正、反转及停止，检查调速是否正常。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 193, "type": "judge", "score": 0.5, "content": "装置通电后，先观察显示屏上显示数据及有无报警信息，并检查数控装置内有关指示灯等信号是否正常，有无异常气味等。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 194, "type": "judge", "score": 0.5, "content": "对于加工中心，还必须调整机械手与主轴、刀库的相对位置，以及托板与交换工作台面的相对位置，以保证换刀和交换工作台时的准确、平稳、可靠。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 195, "type": "judge", "score": 0.5, "content": "运行试验用与规定的承载工件最大重量相当的重物置于工作台上，使负载均匀。然后以最低、最高进给速度进行运转。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 196, "type": "judge", "score": 0.5, "content": "数控机床的几何精度检验包括回转轴原点的复归精度。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 197, "type": "judge", "score": 0.5, "content": "机床的几何精度是一项综合精度。", "options": ["正确 (√)", "错误 (×)"], "answer": "×", "images": []}, {"index": 198, "type": "judge", "score": 0.5, "content": "机床的切削精度不仅反映了机床的几何精度和定位精度，同时还包括了试件的材料、环境温度、刀具性能以及切削条件等各种因素造成的误差。", "options": ["正确 (√)", "错误 (×)"], "answer": "√", "images": []}, {"index": 19       });
    }
    else if (currentMode === 'favorite') {
      paperSelect.style.display = 'none';
      const favs = getFavorites();
      const keys = Object.keys(favs);
      if (keys.length === 0) {
        alert('收藏夹为空！在刷题时点击“收藏本题”即可收录。');
        modeSelect.value = 'practice';
        currentMode = 'practice';
        initQuestionsForMode();
        return;
      }
      activeQuestions = [];
      allPapers.forEach(p => {
        p.questions.forEach(q => {
          const key = p.id + '_' + q.index;
          if (favs[key]) {
            activeQuestions.push({ ...q, paperId: p.id });
          }
        });
      });
    }

    currentIndex = 0;
    renderCardGrid();
    renderQuestion();
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Timer
  function startExamTimer(seconds) {
    examTotalSeconds = seconds;
    examSecondsLeft = seconds;
    examTimer.style.display = 'inline-flex';
    btnSubmitExam.style.display = 'inline-flex';
    updateTimerDisplay();

    examTimerInterval = setInterval(() => {
      examSecondsLeft--;
      updateTimerDisplay();
      if (examSecondsLeft <= 0) {
        clearInterval(examTimerInterval);
        alert('考试时间到！系统将为您自动交卷。');
        submitExam();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(examSecondsLeft / 60);
    const s = examSecondsLeft % 60;
    timerText.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    
    examTimer.classList.remove('warning', 'danger');
    if (examSecondsLeft <= 300) {
      examTimer.classList.add('danger');
    } else if (examSecondsLeft <= 900) {
      examTimer.classList.add('warning');
    }
  }

  // Render Question Content
  function renderQuestion() {
    if (activeQuestions.length === 0) return;
    const q = activeQuestions[currentIndex];
    const qKey = getQuestionKey(q);

    currentQNum.textContent = currentIndex + 1;
    totalQNum.textContent = activeQuestions.length;

    badgeType.textContent = q.type === 'choice' ? '单选题' : '判断题';
    badgeScore.textContent = (q.score || 0.5) + '分';

    const favs = getFavorites();
    const isFav = !!favs[qKey];
    badgeFav.style.display = isFav ? 'inline-block' : 'none';
    btnToggleFav.textContent = isFav ? '★ 已收藏' : '⭐ 收藏本题';

    questionContent.textContent = q.content;

    // Images
    questionImages.innerHTML = '';
    if (q.images && q.images.length > 0) {
      q.images.forEach(imgSrc => {
        const wrap = document.createElement('div');
        wrap.className = 'q-img-wrap';
        wrap.title = '点击放大查看电气原理图';
        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = '电路图';
        wrap.appendChild(img);
        wrap.onclick = () => openLightbox(imgSrc);
        questionImages.appendChild(wrap);
      });
    }

    // Options
    optionsList.innerHTML = '';
    const isExam = currentMode.startsWith('exam') || currentMode === 'quick';
    const isRecite = currentMode === 'recite';
    const userSelected = userAnswers[qKey];

    q.options.forEach((optStr, optIdx) => {
      const item = document.createElement('div');
      item.className = 'option-item';

      let letter = '';
      let text = optStr;
      if (q.type === 'choice') {
        const m = optStr.match(/^([A-D])[、\.](.*)/);
        if (m) {
          letter = m[1];
          text = m[2];
        } else {
          letter = ['A', 'B', 'C', 'D'][optIdx];
        }
      } else {
        letter = optIdx === 0 ? '√' : '×';
        text = optStr;
      }

      // Check states
      if (isRecite) {
        if (letter === q.answer) {
          item.classList.add('correct');
        }
      } else if (isExam) {
        if (userSelected === letter) {
          item.classList.add('selected');
        }
      } else {
        // Practice mode
        if (userSelected) {
          if (letter === q.answer) {
            item.classList.add('correct');
          }
          if (userSelected === letter && userSelected !== q.answer) {
            item.classList.add('wrong');
          }
        }
      }

      item.innerHTML = `
        <div class="option-letter">${letter}</div>
        <div class="option-text">${text}</div>
        <div class="option-status-icon">${letter === q.answer ? '✓' : '✗'}</div>
      `;

      item.onclick = () => onSelectOption(q, letter);
      optionsList.appendChild(item);
    });

    // Explanation Box
    if (isRecite || (!isExam && userSelected)) {
      explanationBox.classList.add('show');
      correctAnswerText.textContent = q.answer;
    } else {
      explanationBox.classList.remove('show');
    }

    // Update Nav Buttons
    btnPrev.disabled = (currentIndex === 0);
    btnNext.disabled = (currentIndex === activeQuestions.length - 1);

    updateStats();
    highlightCurrentGrid();
  }

  // Option Click Handler
  function onSelectOption(q, letter) {
    const qKey = getQuestionKey(q);
    const isExam = currentMode.startsWith('exam') || currentMode === 'quick';

    if (!isExam && userAnswers[qKey]) {
      // In practice mode, don't allow changing answer after revealing
      return;
    }

    userAnswers[qKey] = letter;

    // If practice mode and wrong, record to wrong book
    if (!isExam) {
      const wrongs = getWrongs();
      if (letter !== q.answer) {
        wrongs[qKey] = (wrongs[qKey] || 0) + 1;
        saveWrongs(wrongs);
      } else if (currentMode === 'wrong') {
        // If answered correctly in wrong mode, ask or auto-remove
        delete wrongs[qKey];
        saveWrongs(wrongs);
      }
    }

    renderQuestion();

    // Auto advance to next question after 0.5s in practice mode if correct
    if (!isExam && letter === q.answer && currentIndex < activeQuestions.length - 1) {
      setTimeout(() => {
        if (currentIndex < activeQuestions.length - 1) {
          currentIndex++;
          renderQuestion();
        }
      }, 500);
    }
  }

  // Matrix Card Grid
  function renderCardGrid() {
    cardGrid.innerHTML = '';
    activeQuestions.forEach((q, idx) => {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.textContent = idx + 1;
      btn.id = 'gridBtn_' + idx;
      btn.onclick = () => {
        currentIndex = idx;
        renderQuestion();
        closeMobileDrawer();
      };
      cardGrid.appendChild(btn);
    });
  }

  function highlightCurrentGrid() {
    const isExam = currentMode.startsWith('exam') || currentMode === 'quick';

    activeQuestions.forEach((q, idx) => {
      const btn = document.getElementById('gridBtn_' + idx);
      if (!btn) return;
      btn.className = 'card-btn';
      if (idx === currentIndex) {
        btn.classList.add('current');
      }

      const qKey = getQuestionKey(q);
      const ans = userAnswers[qKey];
      if (ans) {
        if (isExam) {
          btn.classList.add('answered');
        } else {
          if (ans === q.answer) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('wrong');
          }
        }
      }
    });
  }

  function updateStats() {
    let answered = 0;
    let correct = 0;
    let wrong = 0;

    activeQuestions.forEach(q => {
      const qKey = getQuestionKey(q);
      const ans = userAnswers[qKey];
      if (ans) {
        answered++;
        if (ans === q.answer) correct++;
        else wrong++;
      }
    });

    statAnswered.textContent = answered;
    statCorrect.textContent = correct;
    statWrong.textContent = wrong;
    answeredCountBadge.textContent = `${answered}/${activeQuestions.length}`;
  }

  // Lightbox
  function openLightbox(src) {
    lightboxImg.src = src;
    lightboxModal.classList.add('open');
  }
  function closeLightbox() {
    lightboxModal.classList.remove('open');
  }

  // Submit Exam
  function submitExam() {
    const totalQ = activeQuestions.length;
    let answeredCount = 0;
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;

    activeQuestions.forEach(q => {
      const qKey = getQuestionKey(q);
      const ans = userAnswers[qKey];
      if (ans) {
        answeredCount++;
        if (ans === q.answer) {
          correctCount++;
          score += (q.score || 0.5);
        } else {
          wrongCount++;
          // Record wrong
          const wrongs = getWrongs();
          wrongs[qKey] = (wrongs[qKey] || 0) + 1;
          saveWrongs(wrongs);
        }
      } else {
        // Unanswered treated as wrong
        wrongCount++;
        const wrongs = getWrongs();
        wrongs[qKey] = (wrongs[qKey] || 0) + 1;
        saveWrongs(wrongs);
      }
    });

    // Format score
    const finalScore = Math.round(score * 10) / 10;
    const isPassed = finalScore >= 60.0;

    clearInterval(examTimerInterval);
    const timeUsedSec = examTotalSeconds - examSecondsLeft;
    const m = Math.floor(timeUsedSec / 60);
    const s = timeUsedSec % 60;

    scoreDisplay.textContent = finalScore;
    passBadge.textContent = isPassed ? '合格 (通过)' : '未及格 (需努力)';
    passBadge.className = 'pass-status-pill ' + (isPassed ? 'passed' : 'failed');

    resTotalScore.textContent = (totalQ * 0.5);
    resCorrectCount.textContent = correctCount;
    resWrongCount.textContent = wrongCount;
    resTimeUsed.textContent = `考试用时：${m} 分 ${s} 秒 (答题率: ${Math.round(answeredCount/totalQ*100)}%)`;

    resultModal.classList.add('open');
  }

  // Drawer
  function openMobileDrawer() {
    sidePanel.classList.add('open');
    drawerOverlay.classList.add('open');
  }
  function closeMobileDrawer() {
    sidePanel.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }

  // Search
  function openSearch() {
    searchModal.classList.add('open');
    searchInput.value = '';
    searchInput.focus();
    renderSearchResults('');
  }
  function closeSearch() {
    searchModal.classList.remove('open');
  }
  function renderSearchResults(kw) {
    if (!kw || kw.trim().length === 0) {
      searchResults.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:2rem;">输入关键词搜索全题库 1000 道题目</div>';
      return;
    }
    const cleanKw = kw.trim();
    const hits = [];

    allPapers.forEach(p => {
      p.questions.forEach(q => {
        if (q.content.includes(cleanKw) || q.options.some(opt => opt.includes(cleanKw))) {
          hits.push({ paper: p, question: q });
        }
      });
    });

    if (hits.length === 0) {
      searchResults.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:2rem;">未找到包含 "${cleanKw}" 的题目</div>`;
      return;
    }

    searchResults.innerHTML = '';
    hits.slice(0, 50).forEach(hit => {
      const item = document.createElement('div');
      item.className = 'search-item';
      const highlighted = hit.question.content.split(cleanKw).join(`<mark>${cleanKw}</mark>`);
      item.innerHTML = `
        <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:0.25rem;">${hit.paper.name} · 第 ${hit.question.index} 题 (${hit.question.type === 'choice' ? '单选' : '判断'})</div>
        <div style="font-size:0.95rem; font-weight:500;">${highlighted}</div>
        <div style="font-size:0.85rem; color:var(--success); margin-top:0.25rem;">标准答案: <b>${hit.question.answer}</b></div>
      `;
      item.onclick = () => {
        closeSearch();
        currentMode = 'practice';
        modeSelect.value = 'practice';
        currentPaperId = hit.paper.id;
        paperSelect.value = currentPaperId;
        initQuestionsForMode();
        currentIndex = hit.question.index - 1;
        renderQuestion();
      };
      searchResults.appendChild(item);
    });
  }

  // Event Listeners
  modeSelect.onchange = (e) => {
    currentMode = e.target.value;
    initQuestionsForMode();
  };

  paperSelect.onchange = (e) => {
    currentPaperId = e.target.value;
    initQuestionsForMode();
  };

  btnPrev.onclick = () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  };

  btnNext.onclick = () => {
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    }
  };

  btnToggleFav.onclick = () => {
    const q = activeQuestions[currentIndex];
    const qKey = getQuestionKey(q);
    const favs = getFavorites();
    if (favs[qKey]) {
      delete favs[qKey];
    } else {
      favs[qKey] = true;
    }
    saveFavorites(favs);
    renderQuestion();
  };

  btnSubmitExam.onclick = () => {
    const totalQ = activeQuestions.length;
    const answered = Object.keys(userAnswers).length;
    const unans = totalQ - answered;
    const msg = unans > 0 ? `您还有 ${unans} 道题未做，确定现在交卷吗？` : '您已完成所有题目，确定现在交卷吗？';
    if (confirm(msg)) {
      submitExam();
    }
  };

  btnReviewWrongs.onclick = () => {
    resultModal.classList.remove('open');
    currentMode = 'practice';
    modeSelect.value = 'practice';
    renderQuestion();
  };

  btnCloseResult.onclick = () => {
    resultModal.classList.remove('open');
    currentMode = 'practice';
    modeSelect.value = 'practice';
    initQuestionsForMode();
  };

  btnToggleDrawer.onclick = openMobileDrawer;
  btnCloseDrawer.onclick = closeMobileDrawer;
  drawerOverlay.onclick = closeMobileDrawer;

  btnCloseLightbox.onclick = closeLightbox;
  lightboxModal.onclick = (e) => {
    if (e.target === lightboxModal) closeLightbox();
  };

  btnSearch.onclick = openSearch;
  btnCloseSearch.onclick = closeSearch;
  searchInput.oninput = (e) => renderSearchResults(e.target.value);

  // Theme Toggle
  function initTheme() {
    const saved = localStorage.getItem(STORAGE_THEME) || 'dark';
    document.body.setAttribute('data-theme', saved);
    btnThemeToggle.textContent = saved === 'dark' ? '🌙' : '☀️';
  }
  btnThemeToggle.onclick = () => {
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    localStorage.setItem(STORAGE_THEME, next);
    btnThemeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
  };

  // Keyboard Shortcuts (Desktop)
  window.addEventListener('keydown', (e) => {
    if (searchModal.classList.contains('open')) return;

    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      btnPrev.click();
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      btnNext.click();
    } else if (['1', '2', '3', '4', 'a', 'b', 'c', 'd', 'A', 'B', 'C', 'D'].includes(e.key)) {
      const q = activeQuestions[currentIndex];
      if (!q) return;
      let letter = '';
      if (['1', 'a', 'A'].includes(e.key)) letter = (q.type === 'choice' ? 'A' : '√');
      else if (['2', 'b', 'B'].includes(e.key)) letter = (q.type === 'choice' ? 'B' : '×');
      else if (['3', 'c', 'C'].includes(e.key)) letter = 'C';
      else if (['4', 'd', 'D'].includes(e.key)) letter = 'D';
      if (letter) onSelectOption(q, letter);
    }
  });

  // Touch swipe support (Mobile)
  let touchStartX = 0;
  questionCard.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });
  questionCard.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (diff > 60) {
      btnPrev.click(); // swipe right -> previous
    } else if (diff < -60) {
      btnNext.click(); // swipe left -> next
    }
  }, { passive: true });

  // Boot
  initTheme();
  initPapersDropdown();
  initQuestionsForMode();

})();

</script>

</body>
</html>
